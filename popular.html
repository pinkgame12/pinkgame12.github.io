<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- ============================================================
  PINKGAME — popular.html
  Shows every game marked with the HOT badge (isPop: true) in
  admin.html. Reads from the SAME database as games.html — there's
  nothing to manage here, and nothing to edit when the game list
  changes. Toggle "HOT badge" on a game in admin.html and it shows
  up (or disappears from) this page automatically.
============================================================ -->

<title>PinkGame — Popular</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>

<style>
:root {
  --pink:  #FF2D8A;
  --glow:  #FF2D8A88;
  --dark:  #0a0a0a;
  --card:  #111111;
  --text:  #cccccc;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--dark);
  font-family: 'Rajdhani', sans-serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(#FF2D8A09 1px, transparent 1px),
    linear-gradient(90deg, #FF2D8A09 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 55% 35% at 0% 0%, #FF2D8A10, transparent 65%),
    radial-gradient(ellipse 45% 35% at 100% 100%, #FF2D8A0c, transparent 65%);
  pointer-events: none;
  z-index: 0;
}

header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 20px;
  padding: 0 36px; height: 60px;
  background: #0a0a0af0;
  border-bottom: 1px solid #FF2D8A22;
  backdrop-filter: blur(12px);
}

.logo {
  font-family: 'Orbitron', monospace;
  font-weight: 900; font-size: 1.3rem;
  color: var(--pink); letter-spacing: 3px;
  text-shadow: 0 0 20px var(--glow);
  text-decoration: none;
}

.hdr-div { width: 1px; height: 26px; background: #222; flex-shrink: 0; }

nav { display: flex; gap: 2px; }
nav a {
  text-decoration: none; color: #555;
  font-weight: 600; font-size: 0.82rem;
  letter-spacing: 1.2px; text-transform: uppercase;
  padding: 6px 14px; border-radius: 4px;
  transition: color 0.15s, background 0.15s;
}
nav a:hover { color: #ccc; background: #ffffff08; }
nav a.active { color: var(--pink); }

.search-bar {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto;
  background: #141414; border: 1px solid #222;
  border-radius: 5px; padding: 7px 14px; width: 250px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-bar:focus-within { border-color: var(--pink); box-shadow: 0 0 0 2px #FF2D8A18; }
.search-bar svg { color: #444; flex-shrink: 0; }
.search-bar input {
  background: none; border: none; outline: none;
  color: #ddd; font-family: 'Rajdhani', sans-serif;
  font-size: 0.9rem; font-weight: 500; width: 100%;
}
.search-bar input::placeholder { color: #3a3a3a; }

.hero {
  position: relative; z-index: 5;
  padding: 52px 36px 32px;
  max-width: 1300px; margin: 0 auto;
}
.hero-eyebrow {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem; letter-spacing: 4px;
  color: var(--pink); text-transform: uppercase;
  margin-bottom: 12px; opacity: 0.7;
}
.hero h1 {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(1.8rem, 4vw, 3.5rem);
  line-height: 1.1; color: #fff;
  text-shadow: 0 0 50px #FF2D8A44;
  margin-bottom: 12px;
}
.hero h1 em { font-style: normal; color: var(--pink); }
.hero p { color: #444; font-size: 0.95rem; font-weight: 500; letter-spacing: 0.5px; }

.grid-section {
  position: relative; z-index: 5;
  max-width: 1300px; margin: 0 auto;
  padding: 0 36px 80px;
}
.section-label {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem; letter-spacing: 3px;
  text-transform: uppercase; color: #2e2e2e;
  margin-bottom: 16px; padding-bottom: 10px;
  border-bottom: 1px solid #161616;
}
.section-label b { color: var(--pink); margin-right: 6px; }

.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
  gap: 12px;
}

.loading-msg, .error-msg {
  grid-column: 1 / -1;
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.95rem; font-weight: 600;
  letter-spacing: 0.5px; color: #444;
  padding: 40px 0; text-align: center;
}
.error-msg { color: #ff6b6b; }

.game-card {
  background: var(--card); border: 1px solid #1a1a1a;
  border-radius: 7px; overflow: hidden;
  cursor: pointer; position: relative;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
}
.game-card:hover {
  border-color: var(--pink);
  transform: translateY(-4px);
  box-shadow: 0 8px 28px #FF2D8A20, 0 0 0 1px #FF2D8A18;
}

.thumb {
  width: 100%; aspect-ratio: 16/10;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.8rem; position: relative; overflow: hidden;
}
.thumb::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 20%, #11111199);
}

.play-overlay {
  position: absolute; inset: 0;
  background: #FF2D8A14;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s; z-index: 2;
}
.game-card:hover .play-overlay { opacity: 1; }
.play-btn {
  width: 42px; height: 42px;
  background: var(--pink); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; box-shadow: 0 0 22px #FF2D8Aaa;
}

.info { padding: 10px 12px 12px; }
.name {
  font-weight: 700; font-size: 0.92rem;
  color: #ccc; margin-bottom: 5px; letter-spacing: 0.2px;
}
.tag {
  display: inline-block;
  font-size: 0.65rem; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase;
  color: #383838; border: 1px solid #1e1e1e;
  padding: 2px 8px; border-radius: 3px;
}

.badge-popular {
  position: absolute; top: 7px; left: 7px;
  background: #ff8c00; color: #fff;
  font-family: 'Orbitron', monospace;
  font-size: 0.52rem; font-weight: 700; letter-spacing: 1px;
  padding: 3px 8px; border-radius: 3px; z-index: 3;
  box-shadow: 0 0 10px #ff8c0099;
}

footer {
  position: relative; z-index: 5;
  text-align: center; padding: 18px;
  border-top: 1px solid #111;
  color: #252525; font-size: 0.75rem;
  letter-spacing: 1.5px; font-weight: 600; text-transform: uppercase;
}
footer b { color: #FF2D8A66; }
footer a { color: inherit; text-decoration: none; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #0a0a0a; }
::-webkit-scrollbar-thumb { background: #FF2D8A44; border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--pink); }

@media (max-width: 680px) {
  header { padding: 0 16px; }
  .search-bar { width: 140px; }
  .hero, .grid-section { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>

<body>
<header>
  <a class="logo" href="games.html">PINKGAME</a>
  <div class="hdr-div"></div>
  <nav>
    <a href="games.html">Home</a>
    <a href="popular.html" class="active">Popular</a>
    <a href="new.html">New</a>
  </nav>
  <div class="search-bar">
    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/>
      <path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Search popular..." id="searchInput" oninput="filterGames()"/>
  </div>
</header>

<div class="hero">
  <div class="hero-eyebrow">// Trending Now</div>
  <h1>Most Played.<br><em>Most Addicting.</em></h1>
  <p>The hottest games everyone is playing right now</p>
</div>

<div class="grid-section">
  <div class="section-label"><b>//</b> <span id="sectionCount">0</span> Popular Games</div>
  <div class="game-grid" id="gameGrid"><div class="loading-msg">Loading games…</div></div>
</div>

<footer><b>PINKGAME</b> &nbsp;—&nbsp; Popular Games &nbsp;—&nbsp; <b><a href="otherwebsites.html">OTHER WEBSITES</a></b></footer>

<!-- ============================================================
  FIREBASE + GAMES DATA/RENDERING
  Reads the same site/games document games.html and admin.html use,
  then shows only the games with isPop: true. Nothing here needs
  editing — mark/unmark a game's HOT badge in admin.html and this
  page updates automatically the next time it loads.
============================================================ -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
  import { getAnalytics, logEvent } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js';
  import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyC3jxwyH9Pws4nhIT9ScDffk5CpHa99oMM",
    authDomain: "pinkgame-1d4bf.firebaseapp.com",
    projectId: "pinkgame-1d4bf",
    storageBucket: "pinkgame-1d4bf.firebasestorage.app",
    messagingSenderId: "531941128309",
    appId: "1:531941128309:web:82e55394c6f48666a3603c",
    measurementId: "G-WF5YT7S04W"
  };

  const app = initializeApp(firebaseConfig);
  let analytics;
  try { analytics = getAnalytics(app); } catch (e) {}
  window.fbLog = (name, params = {}) => {
    try { if (analytics) logEvent(analytics, name, params); } catch (e) {}
  };

  const db = getFirestore(app);

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  let allGames = [];
  let searchTerm = '';

  async function loadGames() {
    const gridEl = document.getElementById('gameGrid');
    try {
      const snap = await getDoc(doc(db, 'site', 'games'));
      allGames = snap.exists() ? (snap.data().list || []) : [];
    } catch (err) {
      console.error('Failed to load games from Firestore:', err);
      gridEl.innerHTML = '<div class="error-msg">Couldn\'t load games right now. Please refresh the page.</div>';
      return;
    }
    renderGrid();
  }

  window.filterGames = function () {
    const input = document.getElementById('searchInput');
    searchTerm = input ? input.value.toLowerCase() : '';
    window.fbLog?.('site_search', { query_length: searchTerm.length, page: 'popular' });
    renderGrid();
  };

  function renderGrid() {
    const grid = document.getElementById('gameGrid');
    const count = document.getElementById('sectionCount');
    if (!grid || !count) return;

    const filtered = allGames.filter(g =>
      g.isPop === true &&
      (g.name || '').toLowerCase().includes(searchTerm)
    );

    count.textContent = filtered.length;

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="loading-msg">No popular games found.</div>';
      return;
    }

    grid.innerHTML = filtered.map(g => {
      const thumb = g.img
        ? `<img src="${escapeHtml(g.img)}" alt="${escapeHtml(g.name)}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;">`
        : `<span style="position:relative;z-index:1;">${escapeHtml(g.emoji || '🎮')}</span>`;

      return `
        <div class="game-card" onclick="openGame('${g.id}')">
          <div class="badge-popular">HOT</div>
          <div class="thumb" style="background: radial-gradient(circle at 35% 35%, ${escapeHtml(g.bg || '#111111')}, #0a0a0a); position:relative;">
            ${thumb}
            <div class="play-overlay"><div class="play-btn">▶</div></div>
          </div>
          <div class="info">
            <div class="name">${escapeHtml(g.name)}</div>
            <span class="tag">${escapeHtml(g.cat)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  window.openGame = function (id) {
    const g = allGames.find(x => x.id === id);
    if (!g || !g.url || !g.url.trim()) {
      alert("This game has no URL set yet.");
      return;
    }
    window.fbLog?.('game_open', { game_id: g.id, game_name: g.name, game_category: g.cat, page: 'popular' });
    window.open(g.url, '_blank');
  };

  loadGames();
</script>
</body>
</html>
