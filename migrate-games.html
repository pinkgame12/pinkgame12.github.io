<!DOCTYPE html>

<!-- ============================================================
  PINKGAME — migrate-games.html

  ONE-TIME USE TOOL. This uploads the 44 games that used to be
  hardcoded in games.html into the Firestore "games" collection,
  so you don't have to re-type them all into admin.html by hand.

  HOW TO USE:
    1. Make sure you've already set up Firestore + Authentication
       + an admin user in the Firebase console (see the setup
       instructions given alongside this file).
    2. Open this page and log in with your admin account.
    3. Click "Import 44 Games". Wait for it to finish.
    4. Open admin.html (or games.html) to confirm the games are there.
    5. Delete this file — you don't need it again. Running it a
       second time WILL create duplicate games (it warns you first).
============================================================ -->

<title>PinkGame — Migrate Games (one-time)</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
<style>

p { color:#666; font-size:0.88rem; margin-bottom:18px; line-height:1.5; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:0.7rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#555; margin-bottom:5px; }
.field input { width:100%; background:#161616; border:1px solid #222; color:#ddd; font-family:'Rajdhani',sans-serif; font-size:0.95rem; padding:10px 12px; border-radius:5px; outline:none; }
.field input:focus { border-color:var(--pink); }
button { background:var(--pink); border:none; color:#fff; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.9rem; letter-spacing:1px; text-transform:uppercase; padding:11px 22px; border-radius:5px; cursor:pointer; width:100%; box-shadow:0 0 18px #FF2D8A44; }
button:disabled { opacity:0.5; cursor:not-allowed; }
.status { margin-top:16px; font-size:0.85rem; font-weight:600; white-space:pre-line; line-height:1.6; }
.status.ok { color:#4dff9e; }
.status.err { color:#ff6b6b; }
.status.warn { color:#ffb84d; }
#importPanel { display:none; }
.error-box { background:#2a0f14; border:1px solid #55202a; color:#ff8a94; font-size:0.82rem; font-weight:600; padding:9px 12px; border-radius:5px; margin-bottom:14px; display:none; }
</style>
</head>
<body>
<div class="box">

  <div id="loginPanel">
    <h1>Admin Login Required</h1>
    <p>Sign in with your admin account to run the import.</p>
    <div class="error-box" id="loginError"></div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail"/></div>
    <div class="field"><label>Password</label><input type="password" id="loginPassword"/></div>
    <button id="loginBtn">Sign In</button>
  </div>

  <div id="importPanel">
    <h1>Import 44 Games</h1>
    <p>This uploads the original PinkGame lineup into Firestore. Safe to run once — it checks for existing games first and asks before creating duplicates.</p>
    <button id="importBtn">Import 44 Games</button>
    <div class="status" id="status"></div>
  </div>

</div>

thub.io/going-balls/play","isNew":false,"isPop":false,"isSfc":true}];

  const importBtn = document.getElementById('importBtn');
  const statusEl = document.getElementById('status');

  importBtn.addEventListener('click', async () => {
    statusEl.className = 'status';
    statusEl.textContent = 'Checking for existing games…';
    importBtn.disabled = true;

    try {
      const ref = doc(db, 'site', 'games');
      const snap = await getDoc(ref);
      const existingList = snap.exists() ? (snap.data().list || []) : [];

      if (existingList.length > 0) {
        const proceed = confirm(
          `The games list already has ${existingList.length} game(s) in it.\n\n` +
          `Importing will ADD ${legacyGames.length} more on top of those — ` +
          `if you've already run this before, that means duplicates.\n\nContinue anyway?`
        );
        if (!proceed) {
          statusEl.className = 'status warn';
          statusEl.textContent = 'Import cancelled.';
          importBtn.disabled = false;
          return;
        }
      }

      statusEl.textContent = 'Uploading…';
      const updatedList = [...existingList, ...legacyGames];
      await setDoc(ref, { list: updatedList });

      statusEl.className = 'status ok';
      statusEl.textContent = `Done! Imported ${legacyGames.length} games (${updatedList.length} total now).\nYou can now delete this file and use admin.html from here on.`;
    } catch (err) {
      console.error(err);
      statusEl.className = 'status err';
      statusEl.textContent = 'Import failed — check your Firestore rules allow writes for logged-in users, and check your connection.';
    } finally {
      importBtn.disabled = false;
    }
  });
</script>
